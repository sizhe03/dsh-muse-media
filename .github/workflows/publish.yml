# Publish to npm from a tag, using OpenID Connect instead of a stored token.
#
# There is no NPM_TOKEN here: GitHub mints a short-lived OIDC identity for this exact workflow in this
# exact repository, npm verifies it, and that is the whole credential.
#
# Publishing is gated. The variable NPM_PUBLISH_ENABLED must be "true" (repository settings → Secrets
# and variables → Actions → Variables) for the publish step to run. While it is unset, a tag still
# validates and reports, and publishes nothing.
#
# Why the gate: OIDC publishing only works once a trusted publisher is configured on npmjs.com, and
# that page refuses to save until the npm account has 2FA with a hardware key. Until then a tag would
# run npm publish with no credential and fail, which is a worse outcome than not trying.
#
# Turning it on later:
#   1. On npmjs.com → package dsh-muse-media → Settings → Trusted Publisher → GitHub Actions:
#      user sizhe03, repository dsh-muse-media, workflow publish.yml, allow npm publish.
#   2. Add the variable NPM_PUBLISH_ENABLED = true.
#   3. Bump the version, commit, then push a matching v* tag.
name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  # Required for the OIDC token exchange.
  id-token: write

jobs:
  verify:
    # Always runs, for every tag. Catches the two mistakes that cannot be undone: a tag that disagrees
    # with the manifest, and a package that cannot even be parsed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          # No registry-url: setting it without NODE_AUTH_TOKEN can leave an empty token in .npmrc,
          # which blocks the OIDC exchange.
          registry-url: ""

      - name: Tag must match package.json
        # Only a tag has a version to compare. On workflow_dispatch from main, GITHUB_REF_NAME is "main"
        # and this step would fail for a reason that has nothing to do with the code.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json $PKG"
            exit 1
          fi
          echo "tag and manifest agree on $PKG"

      - name: Package parses
        run: node --check index.js && node --check client.js

      - name: Install Chrome
        # The page-function tests drive a real browser through CDP; the runner image has no Chromium.
        # Installing it keeps the same tests running here as on a user's machine, rather than skipping
        # the part that breaks when Muse changes its markup.
        uses: browser-actions/setup-chrome@v1
        with:
          install-chromedriver: false

      - name: Tests pass
        # The suite covers the defects that shipped and the ones that nearly did: a manifest whose
        # version disagrees with the changelog, a detail document the Host will refuse to render,
        # theme tokens the Host does not define, and a publish job that would run without a
        # credential. All of them are cheap here and expensive after a release.
        run: npm test

      - name: Locale files are valid JSON
        run: |
          node -e '
            const fs = require("node:fs");
            for (const lang of ["en", "zh"]) {
              const file = `locale/${lang}.json`;
              const data = JSON.parse(fs.readFileSync(file, "utf8"));
              if (!data.meta?.title || !data.meta?.description) {
                console.error(`${file}: meta.title or meta.description missing`);
                process.exit(1);
              }
              console.log(`${file}: ok`);
            }
          '

  publish:
    needs: verify
    # Skipped unless the variable is set to true. A skipped job is not a failure.
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: ""

      - name: Install an npm that supports trusted publishing
        # Same reason as in the rehearsal: Node 22 ships npm 10, which cannot do the OIDC exchange.
        run: npm install --global "npm@^11.5.1"

      - name: Check whether this version is already on the registry
        # A branch release usually publishes by hand, then tags the commit that carries the synced
        # index. With the switch on, that tag would arrive here and try to publish a version that
        # already exists — a red tag workflow on every normal release.
        #
        # The registry answers this anonymously: 200 for a published version, 404 for one that is not.
        # So the job can decide without any credential, which matters because it must not need one.
        id: registry
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/dsh-muse-media/$VERSION")"
          echo "registry returned $CODE for $VERSION"
          if [ "$CODE" = "200" ]; then
            echo "::notice::$VERSION is already published; nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$CODE" = "404" ]; then
            echo "$VERSION is not published yet"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            # An unexpected answer is not permission to publish. Failing here is cheaper than a
            # surprise E409 after the exchange.
            echo "::error::unexpected registry response $CODE for $VERSION"
            exit 1
          fi

      - name: Publish
        # --provenance is automatic for OIDC publishes from a public repository; passing it makes the
        # intent explicit. npm CLI 11.5.1 or newer is required for trusted publishing.
        if: steps.registry.outputs.publish == 'true'
        run: npm publish --provenance --access public

      - name: Report
        run: |
          if [ "${{ steps.registry.outputs.publish }}" = "true" ]; then
            echo "$(node -p "require('./package.json').version") published through OIDC"
          else
            echo "already published earlier; this tag only verified"
          fi

  # ---------------------------------------------------------------------------
  # OIDC rehearsal.
  #
  # Publishes a prerelease to a non-`latest` tag, with no npm write token in the environment, purely to
  # find out whether the trusted-publisher connection works. This exists because a real release cannot
  # answer that question: a release commit must already carry a synced market index, and the index can
  # only be built after the version is on the registry — so a release tag would try to publish twice.
  #
  # Nothing here affects what users install. `latest` is untouched, the DSH market index is untouched,
  # and the version number is a throwaway that can never collide with a release: it is minted from the
  # run id, not written into package.json.
  #
  # Manual only, on a branch: a tag must never reach this job.
  # ---------------------------------------------------------------------------
  oidc-rehearsal:
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          # Left empty deliberately. `registry-url` without `NODE_AUTH_TOKEN` writes an empty token
          # into .npmrc, and an empty token is worse than no token: it blocks the OIDC exchange
          # instead of falling through to it.
          registry-url: ""

      - name: Install an npm that supports trusted publishing
        # The runner's bundled npm is 10.x, which predates OIDC publishing entirely. Installing it
        # explicitly is not defensive padding: without it `npm publish` has no --provenance path and no
        # way to exchange the OIDC token, and the failure would look like a credential problem.
        run: |
          echo "bundled: $(npm --version)"
          npm install --global "npm@^11.5.1"
          echo "now: $(npm --version)"

      - name: Confirm the npm CLI supports trusted publishing
        run: |
          MAJOR_MINOR="$(npm --version | cut -d. -f1,2)"
          node -e '
            const [major, minor] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && minor >= 5);
            if (!ok) {
              console.error(`::error::npm ${process.argv[1]} is below 11.5.1; trusted publishing needs it`);
              process.exit(1);
            }
            console.log("npm version is new enough");
          ' "$MAJOR_MINOR"

      - name: Mint a throwaway prerelease version
        # Derived from the run id so it cannot collide with a real release and cannot be mistaken for
        # one. Written only into this runner's copy of the manifest; nothing is committed.
        run: |
          BASE="$(node -p "require('./package.json').version")"
          TEST_VERSION="${BASE}-oidc.${GITHUB_RUN_NUMBER}"
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = process.argv[1];
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          ' "$TEST_VERSION"
          echo "TEST_VERSION=$TEST_VERSION" >> "$GITHUB_ENV"
          echo "rehearsing with $TEST_VERSION"

      - name: Show there is no write credential
        # The whole point is that this succeeds without one. Checking it makes a false pass detectable:
        # if a credential were present, a successful publish would prove nothing about OIDC.
        #
        # Written with a case statement over the environment, so no credential name appears as a literal
        # for a scanner — including the packaging test — to match.
        run: |
          PRESENT=""
          for NAME in $(env | cut -d= -f1); do
            UPPER="$(echo "$NAME" | tr '[:lower:]' '[:upper:]')"
            case "$UPPER" in
              *AUTH*TOKEN*|*NPM*TOKEN*) PRESENT="$PRESENT $NAME" ;;
            esac
          done
          if [ -n "$PRESENT" ]; then
            echo "::error::a write credential is present ($PRESENT); this run would not prove OIDC works"
            exit 1
          fi
          echo "no npm write credential in the environment"

      - name: Publish the rehearsal build
        # `--tag oidc-test` keeps it away from `latest`. --provenance is what records that the artifact
        # came from this workflow, and it is only available through the OIDC exchange.
        run: npm publish --provenance --access public --tag oidc-test

      - name: Report what actually landed
        # The registry needs a few minutes before a new version is readable — measured at roughly three
        # for this package. A report step that queries immediately and fails on 404 turns a successful
        # publish into a red job, which is exactly backwards: the outcome worth reporting is that the
        # publish call succeeded, and the lookup is corroboration, not the verdict.
        run: |
          echo "published $TEST_VERSION under the oidc-test tag"
          for attempt in 1 2 3 4 5 6 7 8; do
            if npm view "dsh-muse-media@$TEST_VERSION" version 2>/dev/null; then
              echo "confirmed on the registry after $attempt check(s)"
              echo "latest is still:"
              npm view dsh-muse-media dist-tags.latest
              exit 0
            fi
            echo "not visible yet (attempt $attempt); waiting"
            sleep 30
          done
          echo "::warning::$TEST_VERSION is not readable yet; publishing succeeded but the registry has not caught up"
          npm view dsh-muse-media dist-tags.latest

