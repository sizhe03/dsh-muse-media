name: 报告故障 · Bug report
description: 生图、视频、文件或设置出现异常 · Report a problem with generation, saved files or settings.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        使用方法和功能建议可以发到 [Discussions](https://github.com/sizhe03/dsh-muse-media/discussions)。请从截图和日志里隐去账号、私人对话链接和凭据。

        For questions or ideas, use Discussions. Redact account details, private conversation links and credentials from screenshots and logs.

  - type: textarea
    id: what-happened
    attributes:
      label: 看到的结果 · What happened?
      description: 写明你想完成什么、实际看到什么，以及页面提示（如有）。Include your expected result, the actual result and any message shown.
      placeholder: |
        例：生成记录显示「仅预览」，但同一条 Muse 对话里可以下载大图。
        Example — History shows “Preview only”, and the same Muse conversation has a full-size download.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 操作步骤 · Steps taken
      description: 从哪个页面或按钮开始？出现过一次也可以报告。A one-off incident is worth reporting. Include the page or button you started from.
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: 插件与宿主版本 · Plugin and DSH versions
      placeholder: "Muse x.y.z / DSH x.y.z"
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: 其他线索（选填）· Additional details (optional)
      description: 可附浏览器版本、出现频率，或「设置 → Muse → 设置 → 诊断」里的相关信息。Include the browser version, frequency or relevant details from Settings → Muse → Settings → Diagnostics.
