<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Three Muse accounts with weekly allowance, a usage pill beside the composer, and a generated video frame">
  <title>Muse accounts, weekly allowance, and a generated result</title>

  <rect width="640" height="300" fill="#ffffff"/>

  <!-- ============ left: the three account rows ============ -->
  <g>
    <!-- row 1 -->
    <rect x="32" y="42" width="300" height="60" rx="10" fill="none" stroke="#c9d0dc" stroke-width="1.5"/>
    <rect x="32" y="42" width="3" height="60" rx="1.5" fill="#2f6fed"/>
    <circle cx="52" cy="62" r="4" fill="#1f9d55"/>
    <rect x="64" y="57" width="66" height="10" rx="5" fill="#3d4451"/>
    <rect x="140" y="57" width="40" height="10" rx="5" fill="none" stroke="#2f6fed" stroke-width="1.2"/>
    <rect x="52" y="80" width="150" height="7" rx="3.5" fill="#8b94a5" opacity="0.55"/>
    <!-- the figure -->
    <rect x="252" y="50" width="58" height="16" rx="4" fill="#3d4451"/>
    <rect x="262" y="82" width="40" height="7" rx="3.5" fill="#2f6fed" opacity="0.75"/>

    <!-- row 2 -->
    <rect x="32" y="114" width="300" height="60" rx="10" fill="none" stroke="#c9d0dc" stroke-width="1.5"/>
    <rect x="32" y="114" width="3" height="60" rx="1.5" fill="#8b94a5" opacity="0.4"/>
    <circle cx="52" cy="134" r="4" fill="#c8811a"/>
    <rect x="64" y="129" width="54" height="10" rx="5" fill="#3d4451"/>
    <rect x="128" y="129" width="34" height="10" rx="5" fill="none" stroke="#8b94a5" stroke-width="1.2"/>
    <rect x="52" y="152" width="170" height="7" rx="3.5" fill="#8b94a5" opacity="0.55"/>
    <rect x="262" y="122" width="48" height="16" rx="4" fill="#c8811a"/>
    <rect x="272" y="154" width="30" height="7" rx="3.5" fill="#2f6fed" opacity="0.75"/>

    <!-- row 3: not signed in, no figure -->
    <rect x="32" y="186" width="300" height="60" rx="10" fill="none" stroke="#c9d0dc" stroke-width="1.5"/>
    <rect x="32" y="186" width="3" height="60" rx="1.5" fill="#8b94a5" opacity="0.25"/>
    <circle cx="52" cy="206" r="4" fill="none" stroke="#8b94a5" stroke-width="1.5"/>
    <rect x="64" y="201" width="48" height="10" rx="5" fill="#8b94a5" opacity="0.6"/>
    <rect x="52" y="224" width="132" height="7" rx="3.5" fill="#8b94a5" opacity="0.35"/>
    <!-- primary action only for the signed-out row -->
    <rect x="246" y="194" width="72" height="18" rx="9" fill="#2f6fed"/>
  </g>

  <!-- ============ right: a generated video frame ============ -->
  <g>
    <rect x="356" y="42" width="252" height="150" rx="12" fill="#11151c"/>
    <!-- stylised night scene: a gold band over a dark sky, matching a real generated frame -->
    <rect x="356" y="120" width="252" height="72" rx="12" fill="#1b2431"/>
    <circle cx="470" cy="112" r="22" fill="none" stroke="#d94a4a" stroke-width="5"/>
    <rect x="368" y="150" width="228" height="14" rx="7" fill="#d9a441"/>
    <rect x="368" y="170" width="150" height="8" rx="4" fill="#d9a441" opacity="0.55"/>
    <!-- play affordance -->
    <circle cx="482" cy="117" r="15" fill="#ffffff" opacity="0.92"/>
    <path d="M478 110 L490 117 L478 124 Z" fill="#11151c"/>

    <!-- quota pill, as it appears beside the composer -->
    <rect x="356" y="206" width="196" height="30" rx="15" fill="none" stroke="#c9d0dc" stroke-width="1.5"/>
    <circle cx="374" cy="221" r="5" fill="#2f6fed"/>
    <rect x="388" y="217" width="26" height="8" rx="4" fill="#3d4451"/>
    <rect x="422" y="217" width="76" height="8" rx="4" fill="#8b94a5" opacity="0.6"/>
    <circle cx="516" cy="221" r="5" fill="#8b94a5" opacity="0.5"/>

    <!-- compose bar hint -->
    <rect x="356" y="246" width="252" height="26" rx="13" fill="none" stroke="#c9d0dc" stroke-width="1.5"/>
    <rect x="370" y="256" width="120" height="7" rx="3.5" fill="#8b94a5" opacity="0.4"/>
    <circle cx="592" cy="259" r="9" fill="#2f6fed"/>
  </g>
</svg>
